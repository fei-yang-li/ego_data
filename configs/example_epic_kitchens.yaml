# Example pipeline config for EPIC-KITCHENS-100 (RGB + language, no poses).
# Only the world-model RGB+caption index and visualization make sense here,
# since there are no hand/head poses to derive actions from. The VLA exporter
# will skip these episodes and report them as skipped.
#
# Run with:  python -m ego_pipeline run --config configs/example_epic_kitchens.yaml

reader:
  name: epic_kitchens
  root: /data/EPIC-KITCHENS
  options:
    annotations: /data/EPIC-KITCHENS/EPIC_100_train.csv
    frames_template: "{root}/{participant}/rgb_frames/{video}/frame_{frame:010d}.jpg"
    fps: 50.0
    max_frames_per_segment: 32

normalize:
  target_fps: null           # keep native sampling
  recenter_trajectory: false
  min_frames: 2

visualize:
  enabled: true
  out_dir: out/epic_viz
  num_overlay_frames: 3
  max_episodes: 5

export:
  vla:
    enabled: false           # no poses -> no end-effector actions
  world_model:
    enabled: false           # no head pose -> no camera actions

limit: 20
